name: test

on:
  # Feature branches are tested by their pull request; pushing to them as well ran CI twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: CareerWorkbench
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - name: Install Python
        run: uv python install 3.12
      - name: Set the shared Python interpreter
        run: echo "JOBHUNT_PYTHON=$(uv python find 3.12)" >> "$GITHUB_ENV"
      - name: Install the matching validator from this repository's skills/
        working-directory: CareerWorkbench
        run: node scripts/setup-test-skills.js
      - name: Node tests
        working-directory: CareerWorkbench
        run: |
          npm ci
          npm run format:check
          npm test
      - name: Agent tests with fictional data and fake models
        working-directory: CareerWorkbench/agent
        run: |
          uv sync --frozen
          uv run --frozen python -X utf8 -m pytest -q
          uv run --frozen python -X utf8 -m pytest -q ../skills/campus-recruitment/scripts
      - name: Built wheel demo without private files or network
        working-directory: CareerWorkbench/agent
        run: |
          uv build --wheel --offline --out-dir ../tmp/demo-dist
          uv run --frozen python -X utf8 ../scripts/verify-agent-demo.py --wheel-dir ../tmp/demo-dist --out ../tmp/demo-packaged
